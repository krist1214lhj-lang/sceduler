<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'" />
  <title>대화하기</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body { display: flex; flex-direction: column; background: #fff8ef; color: #3a2a1a; font: 14px "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
    #log { flex: 1; overflow-y: auto; padding: 14px 12px; display: flex; flex-direction: column; gap: 8px; }
    .msg { max-width: 82%; padding: 8px 12px; border-radius: 16px; line-height: 1.45; word-break: keep-all; overflow-wrap: anywhere; }
    .dog { align-self: flex-start; background: #fff; border: 1px solid #f0d6b4; border-bottom-left-radius: 4px; }
    .me { align-self: flex-end; background: #f0a85a; color: #fff; border-bottom-right-radius: 4px; }
    #chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 12px 8px; }
    #chips button { border: 1px solid #e3c9a5; background: #fff; border-radius: 999px; padding: 4px 10px; font: inherit; font-size: 12px; cursor: pointer; }
    form { display: flex; gap: 6px; padding: 10px 12px 12px; border-top: 1px solid #f0dcc2; background: #fff3e3; }
    input { flex: 1; padding: 9px 12px; border: 1px solid #e3c9a5; border-radius: 999px; font: inherit; background: #fff; outline: none; }
    input:focus { border-color: #f0a85a; }
    form button { border: 0; border-radius: 999px; padding: 0 16px; background: #f0a85a; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>
  <div id="log"></div>
  <div id="chips">
    <button>안녕!</button><button>앉아</button><button>손</button><button>간식 줄까?</button>
    <button>산책 가자</button><button>사랑해</button><button>이리 와</button><button>잘 자</button>
  </div>
  <form id="form">
    <input id="input" maxlength="200" autocomplete="off" placeholder="하고 싶은 말을 써 보세요" autofocus />
    <button type="submit">보내기</button>
  </form>
  <script src="chat.js"></script>
</body>
</html>
